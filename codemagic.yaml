workflows:
  ios-release:
    name: Build PomoCute iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: 16.0
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
      - name: Run iOS unit tests
        script: |
          xcodebuild test \
            -project PomoCute.xcodeproj \
            -scheme PomoCute \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Build Pure Native iOS IPA (Release)
        script: |
          xcodebuild -project PomoCute.xcodeproj \
            -scheme PomoCute \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath PomoCute.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r PomoCute.xcarchive/Products/Applications/PomoCute.app Payload/

          if [ ! -f "Payload/PomoCute.app/bell.caf" ]; then
            if [ -f "Payload/PomoCute.app/Audio/bell.caf" ]; then
              cp "Payload/PomoCute.app/Audio/bell.caf" "Payload/PomoCute.app/bell.caf"
            elif [ -f "PomoCute/bell.caf" ]; then
              cp "PomoCute/bell.caf" "Payload/PomoCute.app/bell.caf"
            fi
          fi
          if [ ! -f "Payload/PomoCute.app/pop.caf" ]; then
            if [ -f "Payload/PomoCute.app/Audio/pop.caf" ]; then
              cp "Payload/PomoCute.app/Audio/pop.caf" "Payload/PomoCute.app/pop.caf"
            elif [ -f "PomoCute/pop.caf" ]; then
              cp "PomoCute/pop.caf" "Payload/PomoCute.app/pop.caf"
            fi
          fi
          rm -rf "Payload/PomoCute.app/Audio"

          zip -r PomoCute.ipa Payload
    artifacts:
      - PomoCute.ipa
