name: Build PomoCute iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Matching Installed Simulator Runtime
        run: |
          python3 - <<'PY'
          import glob, json, os, plistlib, subprocess
          try:
              out = subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"], text=True)
              runtimes = json.loads(out).get("runtimes", [])
              installed = {r.get("buildversion") for r in runtimes if r.get("isAvailable")}
          except Exception as e:
              print("Warning listing runtimes:", e)
              installed = set()
          print("Installed simulator runtime builds:", installed)

          candidates = sorted(glob.glob("/Applications/Xcode*.app"), reverse=True)
          selected = None
          for app in candidates:
              plist_path = os.path.join(
                  app,
                  "Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/CoreServices/SystemVersion.plist"
              )
              if os.path.isfile(plist_path):
                  with open(plist_path, "rb") as f:
                      sdk_build = plistlib.load(f).get("ProductBuildVersion")
                  print(f"Found {app} -> SDK build {sdk_build}")
                  if sdk_build in installed:
                      if "Xcode_16" in app:
                          selected = app
                          break
                      if selected is None:
                          selected = app
          if selected:
              print(f"Selecting matching Xcode: {selected}")
              subprocess.check_call(["sudo", "xcode-select", "-s", selected])
          PY
          sudo xcodebuild -runFirstLaunch || true
          echo "Xcode activo:"
          xcodebuild -version

      - name: Prepare Explicit AppIcon Sizes for actool
        run: |
          ICON_DIR="PomoCute/Assets.xcassets/AppIcon.appiconset"
          SRC_ICON="$ICON_DIR/AppIcon.png"
          if [ ! -f "$SRC_ICON" ]; then
            echo "ERROR: No se encontró $SRC_ICON"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess
          icon_dir = "PomoCute/Assets.xcassets/AppIcon.appiconset"
          src = os.path.join(icon_dir, "AppIcon.png")
          specs = [
              ("iphone", "20x20", "2x", 40),
              ("iphone", "20x20", "3x", 60),
              ("iphone", "29x29", "2x", 58),
              ("iphone", "29x29", "3x", 87),
              ("iphone", "40x40", "2x", 80),
              ("iphone", "40x40", "3x", 120),
              ("iphone", "60x60", "2x", 120),
              ("iphone", "60x60", "3x", 180),
              ("ipad", "20x20", "1x", 20),
              ("ipad", "20x20", "2x", 40),
              ("ipad", "29x29", "1x", 29),
              ("ipad", "29x29", "2x", 58),
              ("ipad", "40x40", "1x", 40),
              ("ipad", "40x40", "2x", 80),
              ("ipad", "76x76", "1x", 76),
              ("ipad", "76x76", "2x", 152),
              ("ipad", "83.5x83.5", "2x", 167),
              ("ios-marketing", "1024x1024", "1x", 1024),
          ]
          images = []
          for idiom, size_str, scale, px in specs:
              fname = f"Icon-{idiom}-{size_str}@{scale}.png"
              out_path = os.path.join(icon_dir, fname)
              subprocess.check_call(["sips", "-z", str(px), str(px), src, "--out", out_path], stdout=subprocess.DEVNULL)
              images.append({
                  "filename": fname,
                  "idiom": idiom,
                  "scale": scale,
                  "size": size_str
              })
          contents = {"images": images, "info": {"author": "xcode", "version": 1}}
          with open(os.path.join(icon_dir, "Contents.json"), "w", encoding="utf-8") as f:
              json.dump(contents, f, indent=2)
          print("Catálogo AppIcon multi-resolución generado exitosamente.")
          PY

      - name: Verify Audio Assets and Unit Tests
        run: |
          if [ ! -f "PomoCute/Audio/bell.caf" ] && [ ! -f "PomoCute/bell.caf" ]; then
            echo "ERROR: bell.caf no encontrado en las fuentes del repositorio."
            exit 1
          fi
          if [ ! -f "PomoCute/Audio/pop.caf" ] && [ ! -f "PomoCute/pop.caf" ]; then
            echo "ERROR: pop.caf no encontrado en las fuentes del repositorio."
            exit 1
          fi
          pip3 install --break-system-packages pyyaml || true
          python3 test_timer_logic.py

      - name: Install Pinned XcodeGen (2.42.0)
        run: |
          XCODEGEN_VER="2.42.0"
          curl -Ls "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VER}/xcodegen.zip" -o xcodegen.zip
          unzip -q xcodegen.zip
          cd xcodegen && sudo ./install.sh && cd ..
          rm -rf xcodegen xcodegen.zip
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "=== Info.plist generado ==="
          cat PomoCute/Info.plist

      - name: Build Pure Native iOS IPA (Release)
        run: |
          xcodebuild -project PomoCute.xcodeproj \
            -scheme PomoCute \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath PomoCute.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r PomoCute.xcarchive/Products/Applications/PomoCute.app Payload/

          # Garantizar que bell.caf y pop.caf estén en la raíz del bundle para UNNotificationSound
          if [ ! -f "Payload/PomoCute.app/bell.caf" ]; then
            if [ -f "Payload/PomoCute.app/Audio/bell.caf" ]; then
              cp "Payload/PomoCute.app/Audio/bell.caf" "Payload/PomoCute.app/bell.caf"
            elif [ -f "PomoCute/bell.caf" ]; then
              cp "PomoCute/bell.caf" "Payload/PomoCute.app/bell.caf"
            fi
          fi
          if [ ! -f "Payload/PomoCute.app/pop.caf" ]; then
            if [ -f "Payload/PomoCute.app/Audio/pop.caf" ]; then
              cp "Payload/PomoCute.app/Audio/pop.caf" "Payload/PomoCute.app/pop.caf"
            elif [ -f "PomoCute/pop.caf" ]; then
              cp "PomoCute/pop.caf" "Payload/PomoCute.app/pop.caf"
            fi
          fi

          # Verificación obligatoria de recursos .caf
          if [ ! -f "Payload/PomoCute.app/bell.caf" ]; then
            echo "ERROR CRÍTICO: bell.caf no existe en Payload/PomoCute.app/"
            exit 1
          fi
          if [ ! -f "Payload/PomoCute.app/pop.caf" ]; then
            echo "ERROR CRÍTICO: pop.caf no existe en Payload/PomoCute.app/"
            exit 1
          fi

          rm -rf "Payload/PomoCute.app/Audio"

          echo "Archivos .caf en PomoCute.app bundle:"
          ls -lh Payload/PomoCute.app/*.caf

          zip -r PomoCute.ipa Payload

          echo "=== MEDICIÓN DE TAMAÑO ==="
          ls -lh Payload/PomoCute.app/PomoCute
          du -sh Payload/PomoCute.app
          ls -lh PomoCute.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomoCute-Native-IPA
          path: PomoCute.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.6"
          gh release upload "$RELEASE_TAG" PomoCute.ipa --clobber || \
          gh release create "$RELEASE_TAG" PomoCute.ipa \
            --title "PomoCute $RELEASE_TAG (iOS 15+ Native IPA)" \
            --notes "PomoCute $RELEASE_TAG: Switch Por días / Por semanas en Tu Cesta de Enfoque, corrección de acreditación histórica y limpieza de código." || true

  swift-unit-tests:
    name: Swift unit tests (after build/release)
    needs: build
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || startsWith(github.ref, 'refs/tags/v')) && needs.build.result == 'success'
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Matching Installed Simulator Runtime
        run: |
          python3 - <<'PY'
          import glob, json, os, plistlib, subprocess
          try:
              out = subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"], text=True)
              runtimes = json.loads(out).get("runtimes", [])
              installed = {r.get("buildversion") for r in runtimes if r.get("isAvailable")}
          except Exception:
              installed = set()
          candidates = sorted(glob.glob("/Applications/Xcode*.app"), reverse=True)
          selected = None
          for app in candidates:
              plist_path = os.path.join(
                  app,
                  "Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/System/Library/CoreServices/SystemVersion.plist"
              )
              if os.path.isfile(plist_path):
                  with open(plist_path, "rb") as f:
                      sdk_build = plistlib.load(f).get("ProductBuildVersion")
                  if sdk_build in installed:
                      if "Xcode_16" in app:
                          selected = app
                          break
                      if selected is None:
                          selected = app
          if selected:
              subprocess.check_call(["sudo", "xcode-select", "-s", selected])
          PY
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version

      - name: Prepare Explicit AppIcon Sizes for actool
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          icon_dir = "PomoCute/Assets.xcassets/AppIcon.appiconset"
          src = os.path.join(icon_dir, "AppIcon.png")
          specs = [
              ("iphone", "20x20", "2x", 40),
              ("iphone", "20x20", "3x", 60),
              ("iphone", "29x29", "2x", 58),
              ("iphone", "29x29", "3x", 87),
              ("iphone", "40x40", "2x", 80),
              ("iphone", "40x40", "3x", 120),
              ("iphone", "60x60", "2x", 120),
              ("iphone", "60x60", "3x", 180),
              ("ipad", "20x20", "1x", 20),
              ("ipad", "20x20", "2x", 40),
              ("ipad", "29x29", "1x", 29),
              ("ipad", "29x29", "2x", 58),
              ("ipad", "40x40", "1x", 40),
              ("ipad", "40x40", "2x", 80),
              ("ipad", "76x76", "1x", 76),
              ("ipad", "76x76", "2x", 152),
              ("ipad", "83.5x83.5", "2x", 167),
              ("ios-marketing", "1024x1024", "1x", 1024),
          ]
          images = []
          for idiom, size_str, scale, px in specs:
              fname = f"Icon-{idiom}-{size_str}@{scale}.png"
              out_path = os.path.join(icon_dir, fname)
              subprocess.check_call(["sips", "-z", str(px), str(px), src, "--out", out_path], stdout=subprocess.DEVNULL)
              images.append({
                  "filename": fname,
                  "idiom": idiom,
                  "scale": scale,
                  "size": size_str
              })
          contents = {"images": images, "info": {"author": "xcode", "version": 1}}
          with open(os.path.join(icon_dir, "Contents.json"), "w", encoding="utf-8") as f:
              json.dump(contents, f, indent=2)
          PY

      - name: Install Pinned XcodeGen (2.42.0)
        run: |
          XCODEGEN_VER="2.42.0"
          curl -Ls "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VER}/xcodegen.zip" -o xcodegen.zip
          unzip -q xcodegen.zip
          cd xcodegen && sudo ./install.sh && cd ..
          rm -rf xcodegen xcodegen.zip

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select an available iOS Simulator
        id: simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d.get("name","").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "ERROR: No hay ningún simulador iPhone iOS disponible en este runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Usando simulador iOS: $SIMULATOR_ID"
          echo "udid=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run Swift unit tests on iOS Simulator
        run: |
          xcodebuild test \
            -project PomoCute.xcodeproj \
            -scheme PomoCute \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PomoCute-XCTest-Results
          path: TestResults.xcresult
          if-no-files-found: ignore
