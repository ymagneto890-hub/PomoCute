name: Build Swift iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Pure Native iOS IPA
        run: |
          xcodebuild -project PomoCute.xcodeproj \
            -scheme PomoCute \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath PomoCute.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r PomoCute.xcarchive/Products/Applications/PomoCute.app Payload/
          zip -r PomoCute.ipa Payload
          ls -lh PomoCute.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomoCute-Native-IPA
          path: PomoCute.ipa
