name: Build Swift iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify AppIcon Assets
        run: |
          if [ ! -f "PomoCute/Assets.xcassets/AppIcon.appiconset/AppIcon.png" ]; then
            echo "ERROR: AppIcon.png no encontrado en PomoCute/Assets.xcassets/AppIcon.appiconset/"
            exit 1
          fi
          echo "Catálogo AppIcon verificado correctamente."

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Pure Native iOS IPA
        run: |
          xcodebuild -project PomoCute.xcodeproj \
            -scheme PomoCute \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath PomoCute.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload
          cp -r PomoCute.xcarchive/Products/Applications/PomoCute.app Payload/
          zip -r PomoCute.ipa Payload

          echo "=== MEDICIÓN DE TAMAÑO ==="
          ls -lh Payload/PomoCute.app/PomoCute
          du -sh Payload/PomoCute.app
          ls -lh PomoCute.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PomoCute-Native-IPA
          path: PomoCute.ipa
